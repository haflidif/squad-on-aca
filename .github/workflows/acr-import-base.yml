name: Import Base Images to ACR

on:
  workflow_dispatch:
    description: Manually import base images from Docker Hub to ACR


jobs:
  import-base-images:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate required repository variables
        env:
          ACR_NAME: ${{ vars.SQUAD_ACR_NAME }}
          AZURE_CLIENT_ID: ${{ vars.SQUAD_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.SQUAD_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.SQUAD_AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in ACR_NAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then echo "Missing required repository variable: $name" >&2; exit 1; fi
          done

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.SQUAD_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.SQUAD_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SQUAD_AZURE_SUBSCRIPTION_ID }}

      - name: Import golang base image
        run: |
          az acr import \
            --name ${{ vars.SQUAD_ACR_NAME }} \
            --source "docker.io/library/golang:1.23.4-bookworm" \
            --image "base/golang:1.23.4-bookworm" \
            --force

      - name: Import debian base image
        run: |
          az acr import \
            --name ${{ vars.SQUAD_ACR_NAME }} \
            --source "docker.io/library/debian:bookworm-20240701-slim" \
            --image "base/debian:bookworm-20240701-slim" \
            --force

      - name: Verify imports
        run: |
          echo "Golang image:"
          az acr repository show-tags --name ${{ vars.SQUAD_ACR_NAME }} --repository base/golang || true
          echo ""
          echo "Debian image:"
          az acr repository show-tags --name ${{ vars.SQUAD_ACR_NAME }} --repository base/debian || true
