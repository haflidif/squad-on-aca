name: Squad sandbox conflict hint
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: squad-sandbox-conflict-hints
  cancel-in-progress: false
jobs:
  hint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/sandbox-engine
            scripts
            contracts
            dispatcher
      - uses: ./.github/actions/sandbox-engine
      - uses: actions/github-script@v7
        with:
          script: |
            await require(process.env.SQUAD_ENGINE_ROOT + '/scripts/issue-revise.cjs').conflictHints({ github, context });
